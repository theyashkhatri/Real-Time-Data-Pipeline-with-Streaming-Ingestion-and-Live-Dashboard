x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: ${KAFKA_TOPIC:-orders}
  CONSUMER_GROUP: ${CONSUMER_GROUP:-orders-processor}
  POSTGRES_DSN: postgresql://${POSTGRES_USER:-pipeline}:${POSTGRES_PASSWORD:-pipeline}@postgres:5432/${POSTGRES_DB:-analytics}
  EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-5}
  INVALID_RATE: ${INVALID_RATE:-0.03}
  DUPLICATE_RATE: ${DUPLICATE_RATE:-0.01}
  BATCH_SIZE: ${BATCH_SIZE:-50}
  BATCH_TIMEOUT_SECONDS: ${BATCH_TIMEOUT_SECONDS:-2}

x-app: &app
  build: .
  image: realtime-pipeline:latest
  restart: unless-stopped
  environment: *app-env

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: pipeline-kafka
    ports:
      - "29092:29092" # host access for running scripts outside Docker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: pipeline-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipeline} -d ${POSTGRES_DB:-analytics}"]
      interval: 5s
      timeout: 5s
      retries: 10

  producer:
    <<: *app
    container_name: pipeline-producer
    command: python -m producer.producer
    depends_on:
      kafka:
        condition: service_healthy

  consumer:
    <<: *app
    container_name: pipeline-consumer
    command: python -m consumer.consumer
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  dashboard:
    <<: *app
    container_name: pipeline-dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0 --browser.gatherUsageStats false
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
